services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_api_lab
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  vulnerable-api:
    build:
      context: ./vulnerable-api
      network: host
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/secure_api_lab"
      JWT_SECRET: "development-secret"
      JWT_ALGORITHM: "HS256"
    volumes:
      - ./vulnerable-api/app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
